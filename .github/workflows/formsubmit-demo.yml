name: Verify Live Booking Link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/formsubmit-demo.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the real Vercel booking endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL='https://tony-wulfman-booking-flow-ewtxjav7p-ai-company4.vercel.app/api/book?demo=1'
          for attempt in $(seq 1 24); do
            echo "Attempt ${attempt}"
            code=$(curl --silent --show-error --location --output response.txt --write-out '%{http_code}' "$URL" || true)
            cat response.txt || true
            echo
            if [ "$code" = "200" ] && grep -q '"success":true' response.txt; then
              echo 'Live booking endpoint verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'Live booking endpoint did not become ready in time.'
          exit 1
