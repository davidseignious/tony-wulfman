name: Verify Live Booking Link

on:
  push:
    branches: [main]
    paths:
      - 'api/book-appointment.js'
      - 'components/BookingForm.js'
      - '.github/workflows/formsubmit-demo.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the real booking function without submitting an appointment
        shell: bash
        run: |
          set -euo pipefail
          URL='https://tonywulfman.art/api/book-appointment?health=1'
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}: ${URL}"
            rm -f response.txt
            code=$(curl --silent --show-error --location --connect-timeout 5 --max-time 8 --output response.txt --write-out '%{http_code}' "$URL" || true)
            cat response.txt 2>/dev/null || true
            echo
            if [ "$code" = "200" ] && grep -q '"success":true' response.txt 2>/dev/null && grep -q '"service":"tony-booking"' response.txt 2>/dev/null; then
              echo 'Live Tony booking endpoint verified safely.'
              exit 0
            fi
            [ "$attempt" = "3" ] || sleep 3
          done
          echo 'Live booking endpoint is not healthy yet. This check now fails quickly instead of timing out.'
          exit 1
